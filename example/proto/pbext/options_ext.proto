// copy from  ../../../internal/pbext/options_ext.proto
syntax = "proto3";
option go_package = "github.com/protoc-gen-gom/example/pbout/go/pbext";

import "google/protobuf/descriptor.proto";

extend google.protobuf.MessageOptions {
    bool is_model = 50000;      //告诉插件当前Message为model
    bool inner_msg = 50001;     //该Message是一个内部消息，不会暴露给客户端
}

extend google.protobuf.FieldOptions {
    bool no_sync_client = 50000; //该字段不需要同步给客户端
}