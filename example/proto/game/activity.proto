syntax = "proto3";
option csharp_namespace = "Protocol";
option go_package = "github.com/protoc-gen-gom/example/pbout/go/game";
package game;

import "datas/activity_data.proto";
import "pbext/options_ext.proto";

// 添加活动
message CGameUpdateActivity
{
	option (inner_msg) = true;

	datas.ActivityData info = 1;
}

message SGameUpdateActivity
{
}

// 拉取活动列表
message CGetActivityList
{
}

message SGetActivityList
{
	repeated datas.ActivityData infos = 1;
}

