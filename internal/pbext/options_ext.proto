syntax = "proto3";
option go_package = "./pbext";

import "google/protobuf/descriptor.proto";

// in options_ext.proto path: protoc --go_out=paths=source_relative:. options_ext.proto

extend google.protobuf.MessageOptions {
    bool is_model = 50000;      //告诉插件当前Message为model
}

extend google.protobuf.EnumOptions {
    bool is_code_error = 50000;      //告诉插件生成CodeError
}

extend google.protobuf.FieldOptions {
    bool no_sync_client = 50000; //该字段不需要同步给客户端
}