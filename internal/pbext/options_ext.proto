syntax = "proto3";
option go_package = "xx/pbext";

import "google/protobuf/descriptor.proto";

// in options_ext.proto path: protoc --go_out=paths=source_relative:.  *.proto

extend google.protobuf.MessageOptions {
    bool is_model = 50000;
}

extend google.protobuf.FieldOptions {
    bool no_sync_client = 50000;
}